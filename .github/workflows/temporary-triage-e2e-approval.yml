name: Temporary Triage E2E approval

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to approve
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve the disposable test pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          gh pr review "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --approve \
            --body "Temporary approval for the Hutch Triage Merge CTA E2E test."
