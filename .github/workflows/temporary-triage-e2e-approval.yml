name: Temporary Triage E2E author response

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to approve
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  respond:
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge review feedback as the bot author
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Author acknowledgement for the authorized Hutch Triage Merge CTA E2E test."
